name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Tesseract OCR
        shell: powershell
        run: |
          choco install tesseract -y --no-progress
          if (-not (Test-Path "C:\Program Files\Tesseract-OCR\tesseract.exe")) {
            throw "Tesseract installation not found"
          }

      - name: Build Windows app
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name PDFRenamer app.py

      - name: Bundle Tesseract runtime
        shell: powershell
        run: |
          Copy-Item -Recurse -Force "C:\Program Files\Tesseract-OCR" "dist\PDFRenamer\tesseract"

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: PDFRenamer-Windows-OCR
          path: dist/PDFRenamer/
